name: ds-composites
recipe: drupal10

config:
  php: '8.3'
  via: nginx
  webroot: web
  drush: "*"
  xdebug: false

proxy:
  appserver_nginx:
    - ds-composites.lndo.site
    - ds-machining.lndo.site

services:
  appserver:
    build_as_root:
      - apt-get update && apt-get install -y wget apt-transport-https gnupg ca-certificates curl
      - apt-get install xdg-utils fonts-liberation libasound2 libgbm1 libnspr4 libnss3 libxkbcommon-x11-0 -y
      - mkdir -p /etc/apt/keyrings
      - wget -qO- https://packages.adoptium.net/artifactory/api/gpg/key/public | gpg --dearmor | tee /etc/apt/keyrings/adoptium.gpg > /dev/null
      - echo "deb [signed-by=/etc/apt/keyrings/adoptium.gpg] https://packages.adoptium.net/artifactory/deb buster main" | tee /etc/apt/sources.list.d/adoptium.list
      - apt-get update
      - apt-get install -y temurin-21-jdk

      - apt-get install -y ant
      - docker-php-ext-install pcntl
      - apt-get install -y ca-certificates curl gnupg
      - mkdir -p /etc/apt/keyrings
      - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
      - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_18.x nodistro main" | tee /etc/apt/sources.list.d/pgdg.list
      - apt-get update && apt-get install -y nodejs

  database:
    type: mariadb:10.6
    portforward: 17906
    creds:
      user: drupal10
      password: drupal10
      database: drupal10
    run_as_root:
      - mysql -uroot -e "CREATE DATABASE IF NOT EXISTS dsm; GRANT ALL PRIVILEGES ON dsm.* TO 'drupal10'@'%' IDENTIFIED by 'drupal10';"

  mailhog:
    type: mailhog
    hogfrom:
      - appserver

  node:
    type: node:18
    globals:
      gulp-cli: latest

  search:
    type: solr:8
    core: ds-composites_develop
    portforward: 24829
    config:
      dir: config/solr-config

tooling:
  npm:
    service: node
  node:
    service: node
  gulp:
    service: node
  ant:
    service: appserver
    cmd: 'ant'

events:
  post-start:
    - appserver: cd $LANDO_MOUNT && composer install
    - appserver: /bin/bash $LANDO_MOUNT/config/lando_cmd.sh
